<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="משחק פלטפורמה רטרו בסגנון אטארי: גליל נייר טואלט מנומס במיוחד קופץ מאסלה לאסלה בדרך לכס החרסינה.">
  <title>גליל נייר הטואלט המנומס</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='3' y='3' width='10' height='11' fill='%23ececec'/%3E%3Crect x='4' y='2' width='8' height='1' fill='%23fff'/%3E%3Crect x='6' y='3' width='4' height='2' fill='%23b07040'/%3E%3Crect x='7' y='3' width='2' height='1' fill='%235c3018'/%3E%3Crect x='9' y='7' width='1' height='2' fill='%23000'/%3E%3Crect x='11' y='7' width='1' height='2' fill='%23000'/%3E%3Crect x='9' y='11' width='3' height='1' fill='%23d82828'/%3E%3Crect x='1' y='6' width='2' height='7' fill='%23ececec'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <canvas id="screen" width="320" height="180" role="img" aria-label="גליל נייר הטואלט המנומס — מסך המשחק"></canvas>
    <p id="rotate-hint">לחוויה הטובה ביותר, סובבו את המכשיר לרוחב</p>
  </main>

  <div id="touch" aria-hidden="true">
    <div class="tpad left">
      <button type="button" class="tbtn" id="t-left" tabindex="-1" aria-label="שמאלה"></button>
      <button type="button" class="tbtn" id="t-right" tabindex="-1" aria-label="ימינה"></button>
    </div>
    <div class="tpad right">
      <button type="button" class="tbtn jump" id="t-jump" tabindex="-1" aria-label="קפיצה"></button>
    </div>
  </div>

  <div id="sr" class="sr-only" aria-live="polite"></div>
  <noscript><p class="noscript">כדי לשחק ב"גליל נייר הטואלט המנומס" צריך להפעיל JavaScript בדפדפן.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/font.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/score.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
